name: Mobile Command Desk verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/mobile-command-desk-pwa]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check installable app assets
        run: |
          test -f dist/desk-manifest.webmanifest
          test -f dist/desk-sw.js
          test -f dist/desk-icon.svg
          test -f dist/desk-icon-192.png
          test -f dist/desk-icon-512.png
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('dist/desk-manifest.webmanifest','utf8')); const u=new URL(m.start_url,'https://example.org'); if(u.pathname!=='/desk'||m.scope!=='/desk'||m.display!=='standalone'||!m.id||!Array.isArray(m.icons)||m.icons.length<2) process.exit(1)"
